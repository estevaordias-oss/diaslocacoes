  <rect width="400" height="260" fill="#f2f1ed"/>
  <rect x="4" y="4" width="392" height="252" fill="none" stroke="#d8d5cc" stroke-width="2" stroke-dasharray="8 6"/>
  <g stroke="#2f4658" stroke-width="8" fill="none">
    <line x1="90" y1="40" x2="90" y2="220"/>
    <line x1="310" y1="40" x2="310" y2="220"/>
